#!/usr/sbin/nft -f

flush ruleset

table ip lab_filter {
	chain forward {
		type filter hook forward priority 0; policy drop;

                ct state invalid drop
                ct state established,related counter accept

                iifname "enp0s8" oifname "enp0s3" ip saddr 192.168.50.0/24 counter accept
	}
}

table ip lab_nat {
        chain postrouting {
                type nat hook postrouting priority 100; policy accept;


                oifname "enp0s3" ip saddr 192.168.50.0/24 counter masquerade
        }
}
