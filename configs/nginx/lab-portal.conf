# Install as /etc/nginx/sites-available/lab-portal.conf on lab-server.
server {
    listen 80;
    server_name portal.lab.test 192.168.50.1;
    root /var/www/lab-portal;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/lab-portal.access.log;
    error_log /var/log/nginx/lab-portal.error.log;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }
    # Tests Nginx plus the deployed index file, not other lab services.
    location = /healthz {
        try_files /index.html =503;
    }
    location ~ /\. {
        deny all;
    }
}
